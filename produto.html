<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produto | Brasilidades</title>
  <meta name="description" content="Detalhes do produto Brasilidades: benefícios, modo de uso, ingredientes e avaliações.">
  <meta name="theme-color" content="#91241E">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&family=Josefin+Sans:wght@300;400;600;700&family=Dosis:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="product">
  <div id="app-header"></div>

  <main id="main">
    <div class="container">
      <nav aria-label="Você está em"><ol class="breadcrumb" data-breadcrumb></ol></nav>
      <div data-pdp></div>
    </div>

    <section class="section--sm" data-story-section>
      <div class="container" data-story></div>
    </section>

    <section class="section" id="avaliacoes" aria-labelledby="rev-title" data-reviews-section>
      <div class="container">
        <div class="section-head section-head--left"><h2 class="section-title" id="rev-title">Avaliações</h2></div>
        <div class="reviews" data-reviews></div>
      </div>
    </section>

    <section class="section section--cream" aria-labelledby="rel-title" data-related-section>
      <div class="container">
        <div class="section-head"><h2 class="section-title" id="rel-title">Combine com</h2></div>
        <div data-related></div>
      </div>
    </section>

    <section class="section" aria-labelledby="recent-title" data-recent-section hidden>
      <div class="container">
        <div class="section-head section-head--left"><h2 class="section-title" id="recent-title">Vistos recentemente</h2></div>
        <div data-recent></div>
      </div>
    </section>

    <div class="sticky-buy" data-sticky-buy aria-hidden="true"></div>
  </main>

  <div id="app-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/product.js"></script>
</body>
</html>
